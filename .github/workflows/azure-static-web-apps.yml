# Build & deploy the Astro site to Azure Static Web Apps.
#
# This workflow only builds and deploys — the Azure resources themselves are
# provisioned with Terraform (see infra/). The AZURE_STATIC_WEB_APPS_API_TOKEN
# secret must be created manually in GitHub (Settings > Secrets and variables >
# Actions) from the Terraform output:  terraform -chdir=infra output -raw deployment_token

name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # used for PR preview comments
          action: upload
          app_location: '/' # app source (repo root); Oryx runs `npm install && npm run build`
          api_location: '' # no API (static site only)
          output_location: 'dist' # Astro build output

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR preview environment
    steps:
      - name: Close preview
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
