# Local Azure Static Web Apps emulation:  docker compose up
# Serves the production build at http://localhost:4280 via the SWA CLI emulator.
#
# The source tree is mounted into the container and the site is rebuilt on every
# container start — so after changing source, just re-run `docker compose up`
# (no image rebuild needed). Rebuild the image only when dependencies change:
#   docker compose up --build
#
# For iterative development with hot reload, use `npm run dev` on the host instead.

services:
  swa:
    build: .
    ports:
      - '4280:4280'
    volumes:
      - .:/app
      # Keep the image's node_modules; don't shadow it with the host's (or an empty dir)
      - /app/node_modules
    command: sh -c "npm run build && swa start dist --host 0.0.0.0 --port 4280"
